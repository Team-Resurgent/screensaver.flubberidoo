; Flubberidoo theme - the classic Xbox boot-animation look.
;
; Colors are 0xRRGGBB (0x / # / decimal all accepted). Booleans are true/false.
; Keys are case-insensitive. Lines starting with ';' are comments.
; Only the keys below affect the looping screensaver; the original animation's
; end-logo keys (Slash*, TradeMark*, Xbox*, Brand*) are ignored if present.

; --- Blob (the flubber) -------------------------------------------------
BlobRender      = true
BlobWireframe   = false
BlobColor       = 0x40ff26
BlobGlow        = 0xa0ff40

; --- Scene geometry -----------------------------------------------------
SceneRender     = true
SceneWireframe  = false
SceneIntensity  = 2
SceneAmbient    = 0x35ff1a
SceneDiffuse    = 0x35ff1a
SceneSpecular   = 0x35ff1a

; --- Shields ------------------------------------------------------------
ShieldRender    = false
ShieldWireframe = false
Shield          = 0x66ff4d

; --- Plasma / background glow ------------------------------------------
PlasmaRender    = true
Plasma1         = 0x00ff00
Plasma2         = 0x9fff66
Plasma3         = 0xa0ff60
